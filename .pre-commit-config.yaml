repos:
  - repo: local
    hooks:
      - id: block-private-env-files
        name: Block private env files
        entry: python scripts/check_no_private_env_staged.py
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
