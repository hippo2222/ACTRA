<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="icon" href="../assets/actra_white.ico" type="image/x-icon" />
  <script src="/assets/ThemeManager.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Комплексная сессия – S1</title>
  <style>
    :root {
      --color-page-s1-progress-cluster-bg: color-mix(in srgb, var(--color-surface-1) 82%, var(--color-bg-secondary));
      --color-page-s1-task-type-bg: color-mix(in srgb, var(--color-surface-2) 80%, var(--color-surface-1));
      --color-page-s1-meta-copy: color-mix(in srgb, var(--color-text-secondary) 90%, var(--color-text-main));
      --color-page-s1-status-banner-bg: color-mix(in srgb, var(--color-warning-light) 24%, var(--color-surface-1));
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }

    /* UX-17: Smooth task transition */
    #task-content {
      transition: opacity 0.25s ease-in-out;
    }

    #task-content.task-entering {
      opacity: 0;
    }

    /* UX-19: Result box slide-in */
    #result-box {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #result-box.result-entering {
      opacity: 0;
      transform: translateY(-8px);
    }

    /* Page entrance */
    .s1-page-enter {
      animation: a-fade-in 0.25s ease-out both;
    }

    /* Button interactions */
    .s1-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .s1-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .s1-btn:active {
      transform: scale(0.97);
    }

    .s1-shell-row {
      padding-top: 0.7rem;
      padding-bottom: 0.85rem;
    }

    .s1-toolbar,
    .s1-toolbar-main,
    .s1-toolbar-actions,
    .s1-toolbar-primary,
    .s1-progress-cluster,
    .s1-toolbar-title,
    #task-content,
    #result-inner {
      min-width: 0;
    }

    .s1-toolbar {
      gap: 0.75rem 1rem;
      flex-wrap: wrap;
      white-space: normal;
    }

    .s1-toolbar-main {
      flex: 0 1 clamp(320px, 38vw, 560px);
      align-items: center;
      gap: 0.75rem;
      overflow: hidden;
    }

    .s1-toolbar-title {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 0.1rem;
    }

    .s1-toolbar-heading-row {
      display: block;
      min-width: 0;
      margin-top: 0;
    }

    .s1-toolbar-actions {
      display: flex;
      flex: 1 1 520px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      margin-left: auto;
      gap: 0.6rem 0.85rem;
    }

    .s1-toolbar-primary {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.45rem;
      transition: gap 180ms ease, transform 180ms ease;
    }

    .s1-progress-cluster {
      flex: 1 1 360px;
      min-width: min(250px, 100%);
      max-width: none;
      padding: 0.45rem 0.65rem;
      border-radius: 0.8rem;
      border: 1px solid var(--color-border-subtle);
      background: var(--color-page-s1-progress-cluster-bg);
      overflow: hidden;
      transition: min-width 180ms ease, flex-basis 180ms ease, padding 180ms ease, transform 180ms ease;
    }

    #check-answer-btn {
      transition: min-width 180ms ease, padding 180ms ease, transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    #check-answer-btn .truncate {
      white-space: nowrap;
    }

    @media (min-width: 1024px) {
      .s1-toolbar {
        display: grid !important;
        grid-template-columns: minmax(0, 1.25fr) minmax(18rem, 0.95fr) auto;
        align-items: center;
        column-gap: 0.9rem;
        row-gap: 0.6rem;
      }

      .s1-toolbar-main {
        flex: 0 1 auto;
        min-width: 0;
        width: auto;
        max-width: none;
      }

      .s1-toolbar-actions {
        display: contents !important;
      }

      .s1-progress-cluster {
        justify-self: stretch;
        width: auto;
        min-width: min(320px, 100%);
        max-width: none;
      }

      .s1-toolbar-primary {
        justify-self: end;
      }

      .s1-toolbar[data-force-submit-active="true"] .s1-progress-cluster {
        min-width: min(272px, 100%);
        flex-basis: 312px;
      }
    }

    #current-task-title,
    #complex-title,
    #task-title {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #current-task-title {
      font-size: clamp(1.08rem, 0.95rem + 0.8vw, 1.5rem);
      line-height: 1.2;
      display: block;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #current-task-type {
      display: inline-flex;
      align-items: center;
      padding: 0.14rem 0.48rem;
      border-radius: 999px;
      border: 1px solid var(--color-border-strong);
      background: var(--color-page-s1-task-type-bg);
      color: var(--color-text-main);
      font-size: 0.69rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    #current-task-type.hidden {
      display: none !important;
    }

    #task-progress-meta {
      display: none;
    }

    #current-task-title-toggle {
      display: none !important;
    }

    #current-task-title-toggle.hidden {
      display: none !important;
    }

    #progress-label,
    #difficulty-label {
      min-width: 0;
    }

    #progress-label {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #difficulty-label {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    #theory-session-meta,
    #task-description,
    #result-details,
    #status-banner {
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #complex-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #session-subtitle,
    #task-header-meta,
    #task-progress-meta,
    #progress-label,
    #difficulty-label {
      color: var(--color-page-s1-meta-copy);
      letter-spacing: 0.02em;
      line-height: 1.35;
    }

    #status-banner {
      background: var(--color-page-s1-status-banner-bg);
      box-shadow: var(--shadow-sm);
    }

    #task-content > * {
      min-width: 0;
    }

    html[data-theme="neutral-b"] body {
      --color-surface-1: #fefcff;
      --color-surface-2: #fefcff;
    }

    html.dark #pause-confirm-modal,
    html.dark #resume-modal {
      background-color: rgba(255, 255, 255, 0.1) !important;
    }

    html[data-theme="dark-b"] #pause-confirm-discard {
      color: var(--color-error-text) !important;
    }

    @media (min-width: 1024px) and (max-height: 920px) {
      .s1-shell-row {
        padding-top: 0.55rem;
        padding-bottom: 0.7rem;
      }

      .s1-toolbar {
        gap: 0.6rem 0.8rem;
      }
    }

    @media (max-width: 1023px) {
      .s1-toolbar-main,
      .s1-toolbar-actions {
        flex: 1 1 100%;
      }

      .s1-toolbar-actions {
        justify-content: flex-start;
      }

      .s1-toolbar-primary {
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .s1-progress-cluster {
        width: 100%;
      }
    }

    .s1-root-shell {
      overflow-x: clip;
      overflow-y: visible;
    }
  </style>

    .s1-toolbar[data-force-submit-active="true"] #check-answer-btn {
      width: 204px;
      min-width: 204px;
      padding-left: 1.1rem;
      padding-right: 1.1rem;
    }
  </style>
</head>

<body class="font-display bg-bg-main text-text-main antialiased selection:bg-primary-light selection:text-primary">
  <div class="s1-root-shell relative flex min-h-screen w-full flex-col group/design-root">
    <div class="layout-container flex h-full grow flex-col">
      <div class="s1-shell-row flex flex-1 justify-center sm:px-4 md:px-8 lg:px-12 xl:px-16">
        <div class="layout-content-container flex w-full flex-1 flex-col">
          <!-- TopNavBar -->
          <header
            class="s1-toolbar task-chip mb-3 flex items-center rounded-xl border border-solid border-border-strong bg-surface-1 px-4 py-2 shadow-sm sm:px-5 lg:px-6">
            <div class="s1-toolbar-main flex items-center text-text-main">
              <button id="back-to-complexes-btn"
                class="flex shrink-0 whitespace-nowrap h-9 min-w-[122px] max-w-[480px] cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg bg-primary px-5 text-sm font-bold leading-normal tracking-[0.015em] text-primary-fg disabled:cursor-default disabled:bg-bg-disabled focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 s1-btn"
                type="button">
                <span aria-hidden="true">←</span>
                <span>К списку</span>
              </button>
              <div class="s1-toolbar-title">
                <div class="s1-toolbar-heading-row">
                  <h1 id="current-task-title" class="font-bold tracking-[-0.015em] text-text-main">
                    –
                  </h1>
                  <button id="current-task-title-toggle"
                    class="hidden focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1"
                    type="button"
                    aria-expanded="false">
                    Ещё
                  </button>
                </div>
                <span id="current-task-type" class="hidden">–</span>
                <p id="task-progress-meta" class="hidden text-xs font-normal text-text-secondary"></p>
              </div>
            </div>
            <div class="s1-toolbar-actions">
              <div class="s1-progress-cluster flex flex-col">
                <div class="flex items-center justify-between gap-4">
                  <p id="progress-label" class="text-xs font-medium leading-normal text-text-secondary">
                    Задание –
                  </p>
                  <p id="difficulty-label" class="hidden text-xs font-normal leading-normal text-text-secondary">
                    Сложность: –
                  </p>
                </div>
                <div class="task-chip mt-1.5 h-2 w-full rounded-full bg-bg-secondary">
                  <div id="progress-bar" class="task-chip h-2 rounded-full bg-primary progress-animated"
                    style="width: 0%"></div>
                </div>
              </div>
              <div class="s1-toolbar-primary flex items-center gap-2">
                <button id="check-answer-btn"
                  class="flex h-9 min-w-[118px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden whitespace-nowrap rounded-lg border-2 border-border-strong bg-primary px-5 text-sm font-bold leading-normal tracking-[0.015em] text-primary-fg disabled:cursor-default disabled:border-border-strong disabled:bg-primary-light disabled:text-text-main dark:disabled:text-primary-fg disabled:opacity-100 s1-btn"
                  type="button">
                  <span class="truncate">Проверить</span>
                </button>
                <button id="next-task-btn"
                  class="hidden flex h-9 min-w-[132px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg border-2 border-border-strong bg-surface-2 px-5 text-sm font-bold leading-normal tracking-[0.015em] text-text-main disabled:cursor-default disabled:border-border-strong disabled:bg-primary-light disabled:text-text-main dark:disabled:text-primary-fg disabled:opacity-100 s1-btn"
                  type="button">
                  <span class="truncate">Следующее</span>
                </button>
                <button id="finish-complex-btn"
                  class="flex h-9 min-w-[206px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg border-2 border-border-strong bg-primary px-5 text-sm font-bold leading-normal tracking-[0.015em] text-primary-fg disabled:cursor-default disabled:border-border-strong disabled:bg-primary-light disabled:text-text-main dark:disabled:text-primary-fg disabled:opacity-100 s1-btn"
                  type="button">
                  <span class="truncate">Завершить комплекс</span>
                </button>
              </div>
            </div>
          </header>
          <main class="flex-grow">
            <!-- Global status / error banner -->
            <div id="status-banner"
              class="mb-4 hidden rounded-lg border-2 border-warning bg-surface-1 px-4 py-3 text-sm text-text-main">
            </div>
            <!-- Pause confirmation modal -->
            <div id="pause-confirm-modal"
              class="fixed inset-0 z-50 hidden items-center justify-center bg-scrim-weak dark:bg-scrim px-4 py-6" role="dialog"
              aria-modal="true" aria-labelledby="pause-confirm-title">
              <div class="w-full max-w-md rounded-xl bg-surface-1 dark:bg-surface-2 p-6 shadow-xl ring-1 ring-border-strong">
                <div class="mb-4 flex items-start gap-3">
                  <div
                    class="flex size-10 items-center justify-center rounded-full border border-border-strong bg-surface-2 text-text-secondary">
                    <span class="material-symbols-outlined text-xl">pause</span>
                  </div>
                  <div class="flex-1">
                    <h2 id="pause-confirm-title" class="text-lg font-semibold text-text-main">
                      Поставить на паузу и выйти?
                    </h2>
                    <p class="mt-1 text-sm text-text-secondary">
                      Прогресс будет сохранён. Вы сможете продолжить позже.
                    </p>
                  </div>
                </div>
                <div class="flex flex-col gap-2 sm:flex-row sm:justify-end">
                  <div id="pause-confirm-spinner"
                    class="hidden h-10 w-10 animate-spin rounded-full border-2 border-primary-light border-t-primary">
                  </div>
                  <button id="pause-confirm-continue" type="button"
                    class="inline-flex items-center justify-center rounded-lg border border-border-strong bg-surface-2 px-4 py-2 text-sm font-semibold text-text-main transition hover:bg-bg-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 s1-btn">
                    Продолжить выполнение
                  </button>
                  <button id="pause-confirm-submit" type="button"
                    class="inline-flex items-center justify-center rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-primary-fg transition hover:bg-primary-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 disabled:cursor-not-allowed disabled:opacity-70 s1-btn">
                    Поставить на паузу и выйти
                  </button>

                  <button id="pause-confirm-discard" type="button"
                    class="inline-flex items-center justify-center rounded-lg border-2 border-border-strong bg-error-dark px-4 py-2 text-sm font-semibold text-text-on-dark transition hover:opacity-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-error focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 disabled:cursor-not-allowed disabled:opacity-70 s1-btn">
                    Выйти без сохранения
                  </button>
                </div>
              </div>
            </div>
            <!-- Resume prompt modal -->
            <div id="resume-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-scrim-weak dark:bg-scrim px-4 py-6"
              role="dialog" aria-modal="true" aria-labelledby="resume-modal-title">
              <div class="w-full max-w-md rounded-xl bg-surface-1 dark:bg-surface-2 p-6 shadow-xl ring-1 ring-border-strong">
                <div class="mb-4 flex items-start gap-3">
                  <div

                    <span class="material-symbols-outlined text-xl">play_arrow</span>
                  </div>
                  <div class="flex-1">
                    <h2 id="resume-modal-title" class="text-lg font-semibold text-text-main">
                      Сессия на паузе. Продолжить?
                    </h2>
                    <p class="mt-1 text-sm text-text-secondary">
                      Возобновите выполнение или вернитесь к списку комплексов.
                    </p>
                  </div>
                </div>
                <div class="flex flex-col gap-2 sm:flex-row sm:justify-end">
                  <div id="resume-spinner"
                    class="hidden h-10 w-10 animate-spin rounded-full border-2 border-primary-light border-t-primary">
                  </div>
                  <button id="resume-exit-btn" type="button"
                    class="inline-flex items-center justify-center rounded-lg border border-border-strong bg-surface-2 px-4 py-2 text-sm font-semibold text-text-main transition hover:bg-bg-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 s1-btn">
                    Выйти к списку
                  </button>
                  <button id="resume-continue-btn" type="button"
                    class="inline-flex items-center justify-center rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-primary-fg transition hover:bg-primary-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 disabled:cursor-not-allowed disabled:opacity-70 s1-btn">
                    Возобновить
                  </button>
                </div>
              </div>
            </div>
            <!-- Task header + content (без дополнительной белой карточки) -->

                  </div>

                  </div>

              </div>

                        Засчитать как верное

                      <button
                        id="result-decision-reject"
                        class="inline-flex items-center justify-center rounded-lg border border-border-strong bg-surface-1 px-4 py-2.5 text-sm font-semibold text-text-main transition hover:bg-bg-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-2"
                        type="button">
                        Оставить как неверное
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <!-- Placeholder for task-specific UI (TestUI grid with question card + sidebar) -->
              <div id="task-content" class="flex min-w-0 flex-col gap-3">
                <!-- Task type-specific UI will be injected here -->
              </div>
            </div>
          </main>
          <footer class="mt-auto pt-4"></footer>
        </div>
      </div>
