<!DOCTYPE html>
<html lang="ru">

<head>
  <script src="/assets/ThemeManager.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Комплексная сессия – S1</title>
  <style>
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }

    /* UX-17: Smooth task transition */
    #task-content {
      transition: opacity 0.25s ease-in-out;
    }

    #task-content.task-entering {
      opacity: 0;
    }

    /* UX-19: Result box slide-in */
    #result-box {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #result-box.result-entering {
      opacity: 0;
      transform: translateY(-8px);
    }

    /* Page entrance */
    .s1-page-enter {
      animation: a-slide-up 0.4s ease-out both;
    }

    /* Button interactions */
    .s1-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    .s1-btn:active {
      transform: scale(0.97);
    }

    .s1-shell-row {
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    .s1-toolbar,
    .s1-toolbar-main,
    .s1-toolbar-actions,
    .s1-toolbar-primary,
    .s1-progress-cluster,
    .s1-toolbar-title,
    #task-content,
    #result-inner {
      min-width: 0;
    }

    .s1-toolbar {
      gap: 1rem;
      flex-wrap: wrap;
      white-space: normal;
    }

    .s1-toolbar-main {
      flex: 1 1 320px;
      align-items: flex-start;
    }

    .s1-toolbar-title {
      min-width: 0;
    }

    .s1-toolbar-actions {
      display: flex;
      flex: 1 1 360px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem 1rem;
    }

    .s1-toolbar-primary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .s1-progress-cluster {
      min-width: 140px;
      max-width: 220px;
    }

    #complex-title,
    #task-title {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #theory-session-meta,
    #task-description,
    #result-details,
    #status-banner {
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #complex-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #task-content > * {
      min-width: 0;
    }

    html[data-theme="neutral-b"] body {
      --color-surface-1: #fefcff;
      --color-surface-2: #fefcff;
    }

    html.dark #pause-confirm-modal,
    html.dark #resume-modal {
      background-color: rgba(255, 255, 255, 0.1) !important;
    }

    html[data-theme="dark-b"] #pause-confirm-discard {
      color: var(--color-error-text) !important;
    }

    @media (min-width: 1024px) and (max-height: 920px) {
      .s1-shell-row {
        padding-top: 0.75rem;
        padding-bottom: 0.875rem;
      }

      .s1-toolbar {
        gap: 0.75rem;
      }
    }

    @media (max-width: 1023px) {
      .s1-toolbar-actions {
        justify-content: flex-start;
      }
    }
  </style>

  <link href="/assets/tailwind.css" rel="stylesheet" />
  <link href="/assets/fonts.css" rel="stylesheet" />
  <link href="/assets/lightB-variables.css" rel="stylesheet" />
  <link href="/assets/lightB-components.css" rel="stylesheet" />
  <link href="/assets/animations.css" rel="stylesheet" />
</head>

<body class="font-display bg-bg-main text-text-main antialiased selection:bg-primary-light selection:text-primary">
  <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden group/design-root">
    <div class="layout-container flex h-full grow flex-col">
      <div class="s1-shell-row flex flex-1 justify-center py-5 sm:px-4 md:px-8 lg:px-12 xl:px-16">
        <div class="layout-content-container flex w-full flex-1 flex-col">
          <!-- TopNavBar -->
          <header
            class="s1-toolbar task-chip mb-4 flex items-center justify-between rounded-xl border border-solid border-border-strong bg-surface-1 px-4 py-2 shadow-sm sm:px-6 lg:px-8">
            <div class="s1-toolbar-main flex items-center gap-4 text-text-main">
              <button id="back-to-complexes-btn"
                class="flex h-10 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center gap-1 overflow-hidden rounded-lg bg-primary px-4 text-sm font-bold leading-normal tracking-[0.015em] text-primary-fg disabled:cursor-default disabled:bg-bg-disabled focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 s1-btn"
                type="button">
                <span aria-hidden="true">←</span>
                <span>К списку</span>
              </button>
              <span class="brand-logo size-6" style="color:var(--color-primary)" aria-hidden="true"></span>
              <div class="s1-toolbar-title flex flex-col">
                <h1 id="complex-title" class="text-xl font-bold leading-tight tracking-[-0.015em] text-text-main">
                  Комплексная сессия – S1
                </h1>
                <p id="session-subtitle" class="text-xs font-normal text-text-secondary">
                  <span class="sr-only">Сессия</span><span id="session-id-label" class="hidden">–</span>
                </p>
                <p id="task-header-meta" class="text-xs font-normal text-text-secondary hidden"></p>
              </div>
            </div>
            <div class="s1-toolbar-actions">
              <div class="s1-toolbar-primary flex items-center gap-2">
                <button id="check-answer-btn"
                  class="flex h-10 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg border-2 border-border-strong bg-primary px-4 text-sm font-bold leading-normal tracking-[0.015em] text-primary-fg disabled:cursor-default disabled:border-border-strong disabled:bg-primary-light disabled:text-text-main dark:disabled:text-primary-fg disabled:opacity-100 s1-btn"
                  type="button">
                  <span class="truncate">Проверить ответ</span>
                </button>
                <button id="next-task-btn"
                  class="flex h-10 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg border-2 border-border-strong bg-surface-2 px-4 text-sm font-bold leading-normal tracking-[0.015em] text-text-main disabled:cursor-default disabled:border-border-strong disabled:bg-primary-light disabled:text-text-main dark:disabled:text-primary-fg disabled:opacity-100 s1-btn"
                  type="button">
                  <span class="truncate">Следующее</span>
                </button>
              </div>
              <div class="s1-progress-cluster flex flex-col items-end">
                <div class="flex items-center gap-4">
                  <p id="progress-label" class="text-xs font-medium leading-normal text-text-secondary">
                    Задание: –
                  </p>
                  <p id="difficulty-label" class="hidden text-xs font-normal leading-normal text-text-secondary">
                    Сложность: –
                  </p>
                </div>
                <div class="task-chip mt-1 h-1.5 w-32 rounded-full bg-bg-secondary">
                  <div id="progress-bar" class="task-chip h-1.5 rounded-full bg-primary progress-animated"
                    style="width: 0%"></div>
                </div>
              </div>
              <button id="finish-complex-btn"
                class="flex h-10 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg border-2 border-border-strong bg-primary px-4 text-sm font-bold leading-normal tracking-[0.015em] text-primary-fg disabled:cursor-default disabled:border-border-strong disabled:bg-primary-light disabled:text-text-main dark:disabled:text-primary-fg disabled:opacity-100 s1-btn"
                type="button">
                <span class="truncate">Завершить комплекс</span>
              </button>
            </div>
          </header>
          <main class="flex-grow">
            <!-- Global status / error banner -->
            <div id="status-banner"
              class="mb-4 hidden rounded-lg border-2 border-warning bg-surface-1 px-4 py-3 text-sm text-text-main">
            </div>
            <!-- Pause confirmation modal -->
            <div id="pause-confirm-modal"
              class="fixed inset-0 z-50 hidden items-center justify-center bg-scrim-weak dark:bg-scrim px-4 py-6" role="dialog"
              aria-modal="true" aria-labelledby="pause-confirm-title">
              <div class="w-full max-w-md rounded-xl bg-surface-1 dark:bg-surface-2 p-6 shadow-xl ring-1 ring-border-strong">
                <div class="mb-4 flex items-start gap-3">
                  <div
                    class="flex size-10 items-center justify-center rounded-full border border-border-strong bg-surface-2 text-text-secondary">
                    <span class="material-symbols-outlined text-xl">pause</span>
                  </div>
                  <div class="flex-1">
                    <h2 id="pause-confirm-title" class="text-lg font-semibold text-text-main">
                      Поставить на паузу и выйти?
                    </h2>
                    <p class="mt-1 text-sm text-text-secondary">
                      Прогресс будет сохранён. Вы сможете продолжить позже.
                    </p>
                  </div>
                </div>
                <div class="flex flex-col gap-2 sm:flex-row sm:justify-end">
                  <div id="pause-confirm-spinner"
                    class="hidden h-10 w-10 animate-spin rounded-full border-2 border-primary-light border-t-primary">
                  </div>
                  <button id="pause-confirm-continue" type="button"
                    class="inline-flex items-center justify-center rounded-lg border border-border-strong bg-surface-2 px-4 py-2 text-sm font-semibold text-text-main transition hover:bg-bg-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 s1-btn">
                    Продолжить выполнение
                  </button>
                  <button id="pause-confirm-submit" type="button"
                    class="inline-flex items-center justify-center rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-primary-fg transition hover:bg-primary-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 disabled:cursor-not-allowed disabled:opacity-70 s1-btn">
                    Поставить на паузу и выйти
                  </button>

                  <button id="pause-confirm-discard" type="button"
                    class="inline-flex items-center justify-center rounded-lg border-2 border-border-strong bg-error-dark px-4 py-2 text-sm font-semibold text-text-on-dark transition hover:opacity-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-error focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 disabled:cursor-not-allowed disabled:opacity-70 s1-btn">
                    Выйти без сохранения
                  </button>
                </div>
              </div>
            </div>
            <!-- Resume prompt modal -->
            <div id="resume-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-scrim-weak dark:bg-scrim px-4 py-6"
              role="dialog" aria-modal="true" aria-labelledby="resume-modal-title">
              <div class="w-full max-w-md rounded-xl bg-surface-1 dark:bg-surface-2 p-6 shadow-xl ring-1 ring-border-strong">
                <div class="mb-4 flex items-start gap-3">
                  <div
                    class="flex size-10 items-center justify-center rounded-full border border-border-strong bg-surface-2 text-text-secondary">
                    <span class="material-symbols-outlined text-xl">play_arrow</span>
                  </div>
                  <div class="flex-1">
                    <h2 id="resume-modal-title" class="text-lg font-semibold text-text-main">
                      Сессия на паузе. Продолжить?
                    </h2>
                    <p class="mt-1 text-sm text-text-secondary">
                      Возобновите выполнение или вернитесь к списку комплексов.
                    </p>
                  </div>
                </div>
                <div class="flex flex-col gap-2 sm:flex-row sm:justify-end">
                  <div id="resume-spinner"
                    class="hidden h-10 w-10 animate-spin rounded-full border-2 border-primary-light border-t-primary">
                  </div>
                  <button id="resume-exit-btn" type="button"
                    class="inline-flex items-center justify-center rounded-lg border border-border-strong bg-surface-2 px-4 py-2 text-sm font-semibold text-text-main transition hover:bg-bg-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 s1-btn">
                    Выйти к списку
                  </button>
                  <button id="resume-continue-btn" type="button"
                    class="inline-flex items-center justify-center rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-primary-fg transition hover:bg-primary-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-1 disabled:cursor-not-allowed disabled:opacity-70 s1-btn">
                    Возобновить
                  </button>
                </div>
              </div>
            </div>
            <!-- Task header + content (без дополнительной белой карточки) -->
            <div class="p-4 @container s1-page-enter">
              <div id="task-header-block" class="mb-4 flex flex-col gap-1">
                <p class="text-xs font-semibold uppercase tracking-wide text-text-secondary">
                  Задание
                </p>
                <h2 id="task-title" class="text-xl font-bold leading-tight tracking-[-0.015em] text-text-main">
                  –
                </h2>
                <p id="task-meta" class="text-xs font-medium text-text-secondary">
                  <span id="task-ref-label"></span>
                </p>
                <p id="task-description" class="text-base font-normal leading-relaxed text-text-secondary">
                </p>
              </div>
              <div id="theory-session-banner"
                class="mb-4 hidden rounded-xl border border-primary-light bg-primary-lighter px-4 py-3 shadow-sm">
                <div class="flex items-start gap-3">
                  <div
                    class="flex size-9 shrink-0 items-center justify-center rounded-full border border-primary-light bg-surface-1 text-primary">
                    <span class="material-symbols-outlined text-xl">menu_book</span>
                  </div>
                  <div class="min-w-0">
                    <p id="theory-session-title" class="text-sm font-semibold text-primary-darker">Теория</p>
                    <p id="theory-session-meta" class="mt-1 text-xs leading-relaxed text-primary-darker/80"></p>
                  </div>
                </div>
              </div>
              <!-- Placeholder for task-specific UI (TestUI grid with question card + sidebar) -->
              <div id="task-content" class="flex min-w-0 flex-col gap-3">
                <!-- Task type-specific UI will be injected here -->
              </div>
              <!-- Evaluation result -->
              <div id="result-box" class="mt-4 hidden">
                <div id="result-inner"
                  class="flex flex-col rounded-lg border border-border-strong bg-surface-2 overflow-hidden">
                  <div id="result-header" class="flex items-center gap-3 border-b border-border-strong p-4">
                    <div id="result-icon-wrap"
                      class="flex items-center justify-center size-8 rounded-full shrink-0 border border-border-strong bg-surface-1 text-text-main">
                      <span id="result-icon" class="material-symbols-outlined text-[20px]"
                        style="font-variation-settings: 'FILL' 1, 'wght' 600;"></span>
                    </div>
                    <h3 id="result-title" class="text-sm font-bold leading-tight"></h3>
                  </div>
                  <div id="result-body" class="p-5 flex flex-col gap-3">
                    <p id="result-message" class="text-sm font-medium"></p>
                    <p id="result-details" class="text-sm text-text-secondary leading-relaxed"></p>
                    <div id="result-keywords" class="hidden flex flex-col gap-2"></div>
                    <div id="result-user-answer" class="hidden flex flex-col gap-2"></div>
                    <div id="result-reference" class="hidden flex flex-col gap-2">
                      <h4 id="result-reference-title" class="text-xs font-bold uppercase tracking-wider"></h4>
                      <div id="result-reference-card"
                        class="rounded-lg border border-border-strong bg-surface-1 p-4 shadow-sm">
                        <p id="result-reference-text" class="text-sm text-text-main leading-relaxed">
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>
          <footer class="mt-auto pt-4"></footer>
        </div>
      </div>
    </div>
    <script src="/ui/TestUI/TestUI.web.js"></script>
    <script src="/ui/TestUI/TestUI.question.js"></script>
    <script src="/ui/TestUI/TestUI.sidebar.js"></script>
    <script src="/ui/SequenceUI/SequenceUI.web.js"></script>
    <script src="/ui/ClickUI/TaskMetadataPanel.js"></script>
    <script src="/ui/ClickUI/ClickUI.web.js"></script>
    <script src="/ui/DrawUI/DrawUI.web.js"></script>
    <script src="/ui/OpenAnswerUI/OpenAnswerUI.web.js"></script>
    <script src="/ui/MistakesUI/MistakesUI.web.js"></script>
    <script src="/ui/S1/routes.js"></script>
    <script src="/ui/S1/api-client.js"></script>
    <script src="/ui/S1/session-state.js"></script>
    <script src="/ui/S1/ui-helpers.js"></script>
    <script src="/ui/S1/session_flow.js"></script>
    <script src="/ui/S1/task_renderer_selector.js"></script>
    <script src="/ui/S1/draft-storage.js"></script>
    <script src="/ui/S1/config.js"></script>
    <script src="/ui/S1/task-renderer.js"></script>
    <script src="/ui/S1/success-effects.js"></script>
    <script src="/ui/S1/session_validation.js"></script>
    <script src="/ui/S1/session-controls.js"></script>
    <script src="/ui/S1/main.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (typeof Main !== 'undefined') {
          Main.init();
          window.loadInitialTask = Main.loadInitialTask;
        } else {
          console.error("Main module not loaded");
          const banner = document.getElementById("status-banner");
          if (banner) {
            banner.textContent = "Не удалось инициализировать экран сессии. Обновите страницу.";
            banner.classList.remove("hidden");
          }
        }
      });
    </script>

    <script src="/assets/NotificationUI.js"></script>
    <script src="/assets/ThemeSwitcherUI.js"></script>
    <script src="/assets/ConnectionMonitor.js"></script>
</body>

</html>
