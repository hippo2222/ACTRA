<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="icon" href="../assets/actra_white.ico" type="image/x-icon" />
    <script src="../../assets/ThemeManager.js"></script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title data-i18n="pa.page_title">ACTRA — Редактор аннотаций</title>
    <link rel="stylesheet" href="click_editor.css?v=draw-onboarding-5">
    <script src="click_editor_helpers.js"></script>
    <script src="undo_manager.js"></script>
    <!-- BaseEditor must be loaded before click_editor.js -->
    <script src="autosave_manager.js"></script>
    <script src="ai_ux_messages.js"></script>
    <script src="base_editor.js?v=draw-onboarding-5"></script>
    <script src="click_editor.js?v=draw-onboarding-5" defer></script>

    <link href="../../assets/tailwind.css" rel="stylesheet" />
    <link href="../../assets/fonts.css" rel="stylesheet" />
    <link href="../../assets/lightB-variables.css" rel="stylesheet" />
    <link href="../../assets/lightB-components.css" rel="stylesheet" />
    <link href="../../assets/animations.css" rel="stylesheet" />
    <link href="../../assets/onboarding-tour.css?v=click-onboarding-21" rel="stylesheet" />

</head>

<body
    class="bg-bg-main text-text-main h-screen overflow-hidden flex flex-col font-display antialiased selection:bg-primary-light selection:text-primary">
    <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-bg-main">
        <header
            class="click-editor-header h-16 flex items-center px-6 bg-surface-1 backdrop-blur-md border-b border-border-subtle shrink-0 z-30 shadow-sm sticky top-0"
            data-onboarding-target="click-header" data-onboarding-spotlight="frame">
            <div class="click-editor-header__primary flex items-center gap-4">
                <button id="back-btn" class="p-2 hover:bg-bg-hover rounded-full text-text-secondary transition-colors"
                    title="Библиотека заданий" data-i18n-title="pa.back_title">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <div data-onboarding-target="click-title">
                    <h2 class="text-lg font-bold text-text-main tracking-tight"></h2>
                    <p class="text-xs text-text-secondary">Последнее изменение: 2 минуты назад</p>
                </div>
                <div id="click-mode-switch" class="flex items-center gap-3 ml-4"
                    data-onboarding-target="click-mode-switch">
                    <div class="flex bg-surface-2 border border-border-subtle p-1 rounded-lg shadow-sm">
                        <button id="mode-text-btn"
                            class="mode-toggle-btn flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md transition-all border border-transparent text-text-secondary hover:text-primary hover:bg-bg-hover"
                            type="button" data-mode="text">
                            <span class="material-symbols-outlined text-[14px]">touch_app</span>
                            <span data-i18n="pa.mode_click">Клик</span>
                        </button>
                        <button id="mode-errors-btn" data-onboarding-target="click-errors-mode-button"
                            class="mode-toggle-btn flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md transition-all border border-transparent text-text-secondary hover:text-primary hover:bg-bg-hover"
                            type="button" data-mode="errors">
                            <span class="material-symbols-outlined text-[14px]">error</span>
                            <span data-i18n="pa.mode_errors">Ошибки</span>
                        </button>
                    </div>
                </div>
                <div class="w-px h-5 bg-border-subtle"></div>
                <div id="subtask-toggle" class="hidden flex bg-surface-2 p-1 rounded-lg"
                    data-onboarding-target="click-errors-kind-switch" data-onboarding-spotlight="frame">
                    <button data-subtask-mode="text"
                        data-onboarding-target="click-errors-words-mode"
                        class="subtask-toggle-btn flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md shadow-sm bg-surface-1 text-text-main transition-all">
                        <span class="material-symbols-outlined text-[14px]">text_fields</span>
                        <span data-i18n="pa.subtask_words">Слова</span>
                    </button>
                    <button data-subtask-mode="errors"
                        data-onboarding-target="click-errors-texts-mode"
                        class="subtask-toggle-btn flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md text-text-secondary hover:text-text-main transition-all">
                        <span class="material-symbols-outlined text-[14px]">error</span>
                        <span data-i18n="pa.subtask_texts">Тексты</span>
                    </button>
                </div>
            </div>
            <div class="click-editor-header__drawing-status-shell" id="toolbar-status-row">
                <div data-drawing-status data-onboarding-target="click-drawing-status"
                    class="click-editor-header__drawing-status flex min-h-[2.5rem] items-center gap-3 rounded-xl border border-border-subtle px-3.5 py-2 transition-all duration-200 shadow-sm bg-surface-2 text-text-secondary">
                    <span data-drawing-status-icon=""
                        class="material-symbols-outlined text-[18px] text-primary shrink-0">info</span>
                    <span data-drawing-status-text="" class="min-w-0 flex-1 text-sm leading-snug" data-i18n="pa.status_idle">Режим ожидания</span>
                    <span class="hidden 2xl:inline-flex shrink-0 items-center gap-1.5 border-l border-border-subtle pl-2.5 text-[11px] text-text-secondary"
                        data-finish-hint="">
                        <span class="material-symbols-outlined text-[15px] text-primary">touch_app</span>
                        <span data-i18n="pa.finish_hint">Двойной клик завершает</span>
                    </span>
                </div>
            </div>
            <div class="click-editor-header__actions flex items-center gap-3">
                <div id="save-status-container" class="status-cluster" data-tone="success"
                    data-onboarding-target="click-save-status">
                    <div id="save-status-indicator" class="status-cluster__dot"></div>
                    <div class="status-cluster__body">
                        <span id="save-status-text"
                            class="text-xs font-bold text-text-secondary leading-none" data-i18n="pa.status_saved">Сохранено</span>
                        <span id="save-status-detail"
                            class="text-xs text-text-disabled leading-none mt-1 hidden"></span>
                    </div>
                </div>
                <button type="button"
                    class="onboarding-help-button onboarding-help-button--icon"
                    data-onboarding-help-button
                    data-onboarding-help-mode="direct"
                    data-onboarding-fallback-tour-id="click-editor-authoring"
                    hidden
                    title="Показать обучение"
                    aria-label="Показать обучение"
                    data-i18n-title="pa.show_tutorial"
                    data-i18n-aria="pa.show_tutorial">
                    <span class="material-symbols-outlined" aria-hidden="true">help</span>
                </button>
                <button id="save-task-btn" data-onboarding-target="click-save-action"
                    class="flex items-center gap-2 px-4 py-2 bg-primary hover:bg-primary-dark active:bg-primary-darker text-primary-contrast font-semibold rounded-xl shadow-md text-sm tracking-tight transition focus:outline-none focus:border-primary">
                    <span class="material-symbols-outlined text-[18px]">save</span>
                    <span data-i18n="pa.save">Сохранить</span>
                </button>
            </div>
        </header>
        <div id="mode-pane-container" class="flex-1 flex overflow-hidden">
            <div id="click-mode-pane" class="flex-1 flex overflow-hidden">
                <div class="flex-1 flex flex-col relative bg-canvas-bg canvas-pattern">
                    <div
                        class="h-auto bg-surface-1 border-b border-border-color flex flex-col gap-2 px-4 py-3 shadow-sm z-10">
                        <div class="flex items-center gap-3 gap-y-2 w-full flex-wrap xl:flex-nowrap" id="toolbar-row"
                            data-onboarding-target="click-toolbar" data-onboarding-spotlight="frame">
                            <div
                                class="inline-flex items-center gap-2 rounded-2xl border border-border-subtle bg-surface-2 p-1 shadow-sm"
                                data-onboarding-target="click-tool-choice">
                                <span class="inline-flex" data-toolbar-tooltip="Прямолинейное лассо: ставьте точки по контуру объекта">
                                    <button id="lasso-tool-btn" data-tool="polygon" aria-pressed="true"
                                        class="tool-toggle inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold border border-transparent transition-all">
                                        <span class="material-symbols-outlined text-[18px]">gesture</span>
                                        <span data-i18n="pa.lasso_tool">Прямолинейное лассо</span>
                                    </button>
                                </span>
                                <span class="inline-flex" data-toolbar-tooltip="Свободное рисование: проведите линию или линейный контур непрерывным движением">
                                    <button id="freehand-tool-btn" data-tool="freehand" aria-pressed="false"
                                        class="tool-toggle inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold border border-transparent transition-all">
                                        <span class="material-symbols-outlined text-[18px]">draw</span>
                                        <span data-i18n="pa.freehand_tool">Свободное рисование</span>
                                    </button>
                                </span>
                            </div>
                            <div
                                class="inline-flex items-center gap-2 rounded-2xl border border-border-subtle bg-surface-2 p-1 shadow-sm text-sm flex-none"
                                data-onboarding-target="click-polygon-actions">
                                <span class="inline-flex" data-toolbar-tooltip="Завершить текущий контур после трёх и более точек">
                                    <button id="finish-polygon-btn" type="button" title="Завершить контур (или двойной клик)" data-i18n-title="pa.finish_polygon_title"
                                        class="inline-flex h-11 shrink-0 min-w-[12.75rem] items-center justify-center gap-2 px-3 py-2 rounded-xl border border-primary bg-primary-lighter text-primary shadow-sm transition-all disabled:opacity-70 disabled:pointer-events-none"
                                        aria-label="Завершить контур" data-i18n-aria="pa.finish_polygon" disabled>
                                        <span class="material-symbols-outlined text-[18px]">done</span>
                                        <span class="text-sm font-semibold whitespace-nowrap" data-i18n="pa.finish_polygon">Завершить контур</span>
                                    </button>
                                </span>
                                <span class="inline-flex" data-toolbar-tooltip="Удалить последнюю точку незавершённого контура или выбранную точку">
                                    <button id="delete-last-point-btn" type="button" title="Удалить последнюю точку" data-i18n-title="pa.delete_point"
                                        class="icon-action-btn h-11 w-11 rounded-xl border border-border-subtle text-text-secondary transition disabled:opacity-40 disabled:pointer-events-none"
                                        aria-label="Удалить последнюю точку" data-i18n-aria="pa.delete_point" disabled>
                                        <span class="material-symbols-outlined text-[18px]">backspace</span>
                                        <span class="sr-only" data-i18n="pa.delete_point">Удалить последнюю точку</span>
                                    </button>
                                </span>
                                <span class="inline-flex" data-toolbar-tooltip="Сбросить незавершённый контур и начать заново">
                                    <button id="cancel-polygon-btn" type="button" title="Отменить рисование" data-i18n-title="pa.cancel_draw"
                                        class="icon-action-btn h-11 w-11 rounded-xl border border-border-subtle text-text-secondary transition disabled:opacity-40 disabled:pointer-events-none"
                                        aria-label="Отменить рисование" data-i18n-aria="pa.cancel_draw" disabled>
                                        <span class="material-symbols-outlined text-[18px]">close</span>
                                        <span class="sr-only" data-i18n="pa.cancel_draw">Отменить рисование</span>
                                    </button>
                                </span>
                            </div>
                            <div class="flex items-center gap-2 text-xs text-text-secondary xl:ml-auto justify-end"
                                data-onboarding-target="click-view-actions">
                                <span class="inline-flex" data-toolbar-tooltip="Переключить отображение подписей у контуров">
                                    <button id="toggle-label-visibility-btn"
                                        class="inline-flex h-11 items-center gap-1 px-3 py-1.5 rounded-xl border border-border-subtle bg-surface-1 text-text-secondary hover:bg-bg-hover transition text-xs font-semibold shadow-sm"
                                        title="Переключить отображение названий" data-i18n-title="pa.toggle_labels_title">
                                        <span class="material-symbols-outlined text-[16px]">visibility</span>
                                        <span id="label-visibility-mode-text" class="tracking-tight">Смарт</span>
                                    </button>
                                </span>
                                <span class="inline-flex" data-toolbar-tooltip="Удалить все контуры на изображении">
                                    <button id="clear-annotations-btn" type="button"
                                        class="inline-flex h-11 items-center gap-2 px-4 py-1.5 rounded-xl border border-error-light bg-surface-1 text-error-text hover:bg-error-lighter transition-colors text-sm font-semibold shadow-sm">
                                        <span class="material-symbols-outlined text-[16px]">delete_sweep</span>
                                        <span data-i18n="pa.clear_all">Очистить всё</span>
                                    </button>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1 relative overflow-hidden flex items-center justify-center p-8">
                        <div id="canvas-container" class="relative w-full h-full"
                            data-onboarding-target="click-canvas" data-onboarding-spotlight="frame">
                            <div id="canvas-stage" data-onboarding-spotlight="live"
                                class="relative inline-block bg-surface-1 shadow-2xl rounded-xl border border-border-subtle transform-gpu origin-top-left will-change-transform select-none">
                                <img id="main-image" alt="Medical Scan"
                                    class="block opacity-95 pointer-events-none select-none" src="" />
                                <div id="image-placeholder"
                                    class="hidden absolute inset-0 flex flex-col items-center justify-center text-text-disabled bg-surface-2">
                                    <span class="material-symbols-outlined text-6xl mb-4">image_search</span>
                                    <p class="text-sm font-medium" data-i18n="pa.no_image">Изображение не выбрано</p>
                                </div>
                                <div id="canvas-layer" class="absolute inset-0">
                                    <svg id="annotation-overlay" class="w-full h-full"></svg>
                                </div>
                            </div>
                            <div class="absolute top-4 right-4 z-20">
                                <button id="change-image-btn" data-onboarding-target="click-change-image" data-onboarding-spotlight="live"
                                    class="bg-surface-1 hover:bg-surface-1 text-primary p-2 rounded-full shadow-lg border border-border-subtle flex items-center gap-2 px-3">
                                    <span class="material-symbols-outlined text-[20px]">add_photo_alternate</span>
                                    <span class="text-xs font-bold" data-i18n="pa.change_image">Сменить изображение</span>
                                </button>
                                <input type="file" id="main-image-upload" class="hidden" accept="image/*">
                            </div>
                        </div>
                        <div
                            class="absolute bottom-6 right-6 bg-surface-1 rounded-lg shadow-lg border border-border-subtle p-1 flex items-center gap-1"
                            data-onboarding-target="click-zoom-controls" data-onboarding-spotlight="live">
                            <button id="zoom-out-btn"
                                class="p-1.5 hover:bg-bg-hover rounded text-text-secondary focus:outline-none">
                                <span class="material-symbols-outlined text-[20px]">remove</span>
                            </button>
                            <span id="zoom-level-display"
                                class="text-xs font-semibold text-text-main w-12 text-center select-none">100%</span>
                            <button id="zoom-in-btn"
                                class="p-1.5 hover:bg-bg-hover rounded text-text-secondary focus:outline-none">
                                <span class="material-symbols-outlined text-[20px]">add</span>
                            </button>
                        </div>
                    </div>
                </div>
                <aside
                    class="w-[320px] bg-surface-1 border-l border-border-subtle flex flex-col shrink-0 overflow-y-auto"
                    style="width: 320px;" data-onboarding-target="click-sidebar" data-onboarding-spotlight="frame">
                    <div class="click-sidebar-content p-5 flex flex-col gap-4">
                        <div class="flex flex-col gap-1 pb-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-text-muted" data-i18n="pa.prompt_section_label">Инструкция
                                к заданию</label>
                            <div class="relative" data-onboarding-target="click-prompt">
                                <label class="block text-sm font-medium text-text-main mb-1" data-i18n="pa.prompt_label">Формулировка
                                    задания</label>
                                <textarea id="prompt-textarea"
                                    class="w-full rounded-lg border-border-subtle bg-surface-2 focus:border-primary focus:ring-0 sm:text-sm text-text-main p-3 shadow-sm min-h-[100px]"
                                    placeholder="Введите инструкцию для исполнителя..." data-i18n-placeholder="pa.prompt_ph"></textarea>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 pt-1 -mt-2">
                            <label class="text-xs font-semibold uppercase tracking-wider text-text-muted" data-i18n="pa.criteria_label">Критерии
                                успеха</label>
                            <div data-onboarding-target="click-required-correct">
                                <label class="block text-sm font-medium text-text-main mb-1" data-i18n="pa.required_label">Сколько аннотаций нужно
                                    отметить</label>
                                <div class="flex items-center gap-2">
                                    <input id="required-correct-input"
                                        class="w-20 rounded-lg border-border-subtle bg-surface-2 focus:border-primary focus:ring-0 sm:text-sm text-text-main shadow-sm p-2 disabled:opacity-60 disabled:cursor-not-allowed"
                                        min="1" type="number" value="1"
                                        aria-describedby="required-correct-context required-correct-hint" />
                                    <span id="required-correct-context" class="text-sm text-text-secondary"
                                        aria-live="polite">из 0
                                        контуров</span>
                                </div>
                                <p id="required-correct-hint" class="mt-1 text-xs text-text-secondary"
                                    aria-live="polite">Сначала добавьте
                                    хотя бы один контур.</p>
                            </div>
                        </div>
                        <hr class="border-border-subtle" />
                        <div class="flex flex-col gap-2" data-onboarding-target="click-additional-materials"
                            data-onboarding-spotlight="frame">
                            <button id="additional-info-toggle-btn" type="button"
                                class="flex items-center justify-between w-full text-left rounded-lg px-1 py-1.5 hover:bg-bg-hover transition"
                                aria-expanded="true">
                                <span
                                    class="text-xs font-semibold uppercase tracking-wider text-text-secondary" data-i18n="pa.additional_label">Дополнительные
                                    материалы</span>
                                <span id="additional-info-toggle-icon"
                                    class="material-symbols-outlined text-text-disabled text-[18px]">expand_less</span>
                            </button>
                            <div id="additional-info-content" class="flex flex-col gap-3 mt-1">
                                <div>
                                    <label class="block text-xs font-medium text-text-secondary mb-1" data-i18n="pa.type_label">Тип</label>
                                    <select id="additional-type-select"
                                        class="w-full rounded-lg border-border-subtle bg-surface-2 py-2 px-3 text-sm focus:border-primary focus:ring-primary shadow-sm text-text-main">
                                        <option value="none" data-i18n="pa.type_none">Нет</option>
                                        <option value="text" data-i18n="pa.type_text">Текст</option>
                                        <option value="image" data-i18n="pa.type_image">Изображение</option>
                                        <option value="combined" data-i18n="pa.type_combined">Текст + изображение</option>
                                    </select>
                                </div>
                                <div id="additional-text-group" class="flex flex-col gap-1 hidden">
                                    <label class="block text-xs font-medium text-text-secondary mb-1" data-i18n="pa.additional_text_label">Текст</label>
                                    <textarea id="additional-textarea"
                                        class="w-full rounded-lg border-border-subtle bg-surface-2 focus:border-primary focus:ring-primary sm:text-sm text-text-main shadow-sm p-2 min-h-[80px]"
                                        placeholder="Добавьте пояснение или комментарий" data-i18n-placeholder="pa.additional_text_ph"></textarea>
                                </div>
                                <div id="additional-images-group" class="hidden flex flex-col gap-2">
                                    <div class="flex items-center justify-between">
                                        <label class="text-xs font-medium text-text-secondary" data-i18n="pa.additional_images_label">Изображения</label>
                                        <button id="additional-add-image-btn" type="button"
                                            class="text-xs font-semibold text-primary hover:text-primary-dark flex items-center gap-1">
                                            <span
                                                class="material-symbols-outlined text-[16px]">add_photo_alternate</span>
                                            <span data-i18n="pa.additional_add_btn">Добавить</span>
                                        </button>
                                    </div>
                                    <div class="grid grid-cols-3 gap-2" id="additional-images-grid"></div>
                                    <div id="additional-images-empty"
                                        class="text-xs text-text-disabled bg-surface-2 border border-dashed border-border-subtle rounded-lg px-3 py-2 text-center" data-i18n="pa.no_images">
                                        Нет изображений
                                    </div>
                                    <input id="additional-image-input" class="hidden" type="file" accept="image/*">
                                </div>
                            </div>
                        </div>
                        <hr class="border-border-subtle" />
                        <div class="flex flex-col gap-3" data-onboarding-target="click-annotations-panel"
                            data-onboarding-spotlight="frame">
                            <div class="flex items-center justify-between">
                                <label
                                    class="text-xs font-semibold uppercase tracking-wider text-text-secondary" data-i18n="pa.annotations_label">Аннотации</label>
                                <span data-annotations-count
                                    class="bg-info-lighter text-info-text text-xs font-bold px-2 py-0.5 rounded-full">0
                                    контуров</span>
                            </div>
                            <ul id="annotation-list" class="flex flex-col gap-2">
                                <!-- Points will be rendered here -->
                            </ul>
                        </div>
                    </div>
                </aside>
            </div>
            <div id="errors-mode-pane" class="flex-1 hidden overflow-auto bg-surface-1">
                <!-- Error detection UI will be injected here when enabled -->
            </div>
        </div>
    </main>
    <div id="image-preview-modal"
        class="hidden fixed inset-0 z-50 bg-scrim backdrop-blur-sm flex items-center justify-center p-6">
        <div class="relative bg-surface-1 rounded-2xl shadow-2xl max-w-5xl w-full max-h-[90vh] flex flex-col">
            <button id="image-preview-close"
                class="absolute top-4 right-4 p-2 rounded-full bg-surface-1 hover:bg-surface-2 text-text-main transition shadow-sm border border-border-subtle">
                <span class="material-symbols-outlined">close</span>
            </button>
            <div class="p-4">
                <img id="image-preview-img" alt="Предпросмотр изображения"
                    class="w-full max-h-[80vh] object-contain rounded-xl bg-surface-2">
            </div>
        </div>
    </div>
    <!-- Inline fallback for Errors mode UI (from MistakesClickUI/Main.html) -->

    <template id="errors-mode-template">
        <main class="flex-1 px-4 py-6 sm:px-6 bg-bg-main">
            <div class="max-w-5xl mx-auto flex flex-col gap-3">
                <div data-errors-subpane="text" class="flex flex-col gap-3"
                    data-onboarding-target="click-errors-authoring">
                    <section data-pane-container
                        class="bg-surface-1 rounded-xl border border-border-subtle shadow-sm overflow-hidden">
                        <div class="px-5 pb-5 pt-6 flex flex-col gap-4">
                            <div class="flex flex-wrap items-center gap-2"
                                data-onboarding-target="click-errors-pane-tabs">
                                <button data-pane-toggle="primary"
                                    data-onboarding-target="click-errors-primary-tab"
                                    class="inline-flex items-center gap-2 px-4 py-2 text-xs font-semibold rounded-lg shadow-sm bg-primary text-primary-contrast active:scale-[0.99] transition">
                                    <span class="material-symbols-outlined text-[16px]">edit</span>
                                    <span data-i18n="pa.primary_tab">Основной текст</span>
                                </button>
                                <button data-pane-toggle="reference"
