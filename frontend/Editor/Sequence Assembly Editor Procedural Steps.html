<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="icon" href="../assets/actra_white.ico" type="image/x-icon" />
    <script src="../../assets/ThemeManager.js"></script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title data-i18n="seq_editor.page_title">ACTRA — Редактор последовательностей</title>
    <link rel="stylesheet" href="sequence_editor.css?v=sequence-onboarding-2">
    <!-- BaseEditor dependencies -->
    <script src="undo_manager.js"></script>
    <script src="autosave_manager.js"></script>
    <script src="../../assets/NotificationUI.js"></script>
    <script src="ai_ux_messages.js"></script>
    <script src="base_editor.js"></script>
    <script src="sequence_editor.js?v=sequence-onboarding-10" defer></script>

    <link href="../../assets/tailwind.css" rel="stylesheet" />
    <link href="../../assets/fonts.css" rel="stylesheet" />
    <link href="../../assets/lightB-variables.css" rel="stylesheet" />
    <link href="../../assets/lightB-components.css" rel="stylesheet" />
    <link href="../../assets/animations.css" rel="stylesheet" />
    <link href="/assets/onboarding-tour.css?v=sequence-onboarding-10" rel="stylesheet" />

</head>

<body
    class="bg-bg-main text-text-main h-screen overflow-hidden flex font-display selection:bg-primary-light selection:text-primary antialiased">
    <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-bg-main">
        <header
            class="h-16 flex items-center justify-between gap-4 px-6 bg-surface-1 backdrop-blur-md border-b border-border-subtle shrink-0 z-10 sticky top-0"
            data-onboarding-spotlight="frame"
            data-onboarding-target="sequence-header">
            <div class="flex min-w-0 flex-1 items-center gap-4 text-text-main">
            <div class="flex min-w-0 flex-1 items-center gap-4 text-text-main">
                <button id="back-to-dashboard" data-i18n-title="seq_editor.back_title" title="Библиотека заданий"
                    class="p-2 rounded-full hover:bg-bg-hover text-text-secondary transition-colors">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <div class="flex min-w-0 flex-1 items-center gap-4">
                    <h2 class="min-w-0 flex-1 text-lg font-bold text-text-main tracking-tight flex items-center gap-2">
                        <span data-i18n="seq_editor.editing_label">Редактирование:</span>
                        <span id="task-title-display" class="text-text-main"
                            data-onboarding-target="sequence-title" data-i18n="seq_editor.loading">Загрузка...</span>
                    </h2>
                    <div id="save-status-container" class="sequence-header-status status-cluster" data-tone="success"
                        data-onboarding-target="sequence-save-status">
                        <div id="save-status-indicator" class="status-cluster__dot"></div>
                        <div class="status-cluster__body">
                            <span id="save-status-text"
                                class="text-[10px] font-bold text-text-secondary uppercase tracking-tight leading-none" data-i18n="seq_editor.status_saved">Изменения
                                сохранены</span>
                            <span id="save-status-detail"
                                class="text-[9px] text-text-disabled leading-none mt-1 hidden"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex shrink-0 items-center gap-3 pl-2">
                <!-- Undo/Redo buttons -->
                <div class="flex items-center gap-1 border-r border-border-subtle pr-3"
                    data-onboarding-target="sequence-history-actions">
                    <button id="undo-btn" disabled title="\u041e\u0442\u043c\u0435\u043d\u0438\u0442\u044c (Ctrl+Z)"
                        class="p-2 rounded-lg text-text-disabled hover:text-primary hover:bg-bg-hover transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-text-disabled">
                        <span class="material-symbols-outlined text-[20px]">undo</span>
                    </button>
                    <button id="redo-btn" disabled
                        title="\u041f\u043e\u0432\u0442\u043e\u0440\u0438\u0442\u044c (Ctrl+Y)"
                        class="p-2 rounded-lg text-text-disabled hover:text-primary hover:bg-bg-hover transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-text-disabled">
                        <span class="material-symbols-outlined text-[20px]">redo</span>
                    </button>
                </div>
                <button type="button"
                    class="onboarding-help-button onboarding-help-button--icon"
                    data-onboarding-help-button
                    data-onboarding-help-mode="direct"
                    data-onboarding-tour-id="sequence-editor-authoring"
                    hidden
                    data-i18n-title="seq_editor.show_tutorial"
                    title="Показать обучение"
                    data-i18n-aria="seq_editor.show_tutorial"
                    aria-label="Показать обучение">
                    <span class="material-symbols-outlined" aria-hidden="true">help</span>
                </button>
                <button id="save-task-btn"
                    data-onboarding-target="sequence-save-action"
                    class="flex items-center justify-center gap-2 bg-primary hover:bg-primary-dark text-primary-contrast font-bold rounded-lg px-5 py-2 transition-colors shadow-md text-sm">
                    <span class="material-symbols-outlined text-[18px]">save</span>
                    <span data-i18n="seq_editor.save_btn">Сохранить</span>
                </button>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto">
            <div class="max-w-5xl mx-auto p-8 pb-32">
                <div class="mb-8" data-onboarding-spotlight="frame"
                    data-onboarding-target="sequence-prompt-block">
                    <label class="block text-xs font-semibold text-text-disabled uppercase tracking-wider mb-2" data-i18n="seq_editor.prompt_label">Текст
                        задания</label>
                    <textarea id="prompt-textarea"
                        data-onboarding-target="sequence-prompt-text"
                        class="block w-full rounded-lg border-border-subtle bg-surface-2 shadow-sm focus:border-primary focus:ring-0 sm:text-sm text-text-main leading-relaxed"
                        data-i18n-placeholder="seq_editor.prompt_placeholder" placeholder="Опишите процедуру или инструкцию для обучающегося..." rows="3"></textarea>
                </div>
                <div id="levels-container" class="space-y-6" data-onboarding-target="sequence-levels-container">
                    <!-- Levels will be rendered here -->
                </div>
                <div class="flex items-center justify-between pt-4">
                    <button id="clear-all-btn"
                        data-onboarding-target="sequence-clear-all"
                        class="flex items-center gap-2 bg-surface-1 border border-border-subtle text-text-secondary hover:bg-bg-hover hover:text-error font-medium px-4 py-2 rounded-lg text-sm transition-colors shadow-sm">
                        <span class="material-symbols-outlined text-[18px]">delete_sweep</span>
                        <span data-i18n="seq_editor.clear_all_btn">Очистить всё</span>
                    </button>
                    <button id="add-level-btn"
                        data-onboarding-target="sequence-add-level"
                        class="flex items-center gap-2 bg-primary hover:bg-primary-dark text-primary-contrast font-bold px-6 py-2.5 rounded-lg shadow-md transition-transform active:scale-95">
                        <span class="material-symbols-outlined text-[20px]">add_circle</span>
                        <span data-i18n="seq_editor.add_level_btn">Добавить уровень</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <aside
        class="w-[320px] bg-surface-1 border-l border-border-subtle flex flex-col shrink-0 z-20 h-full overflow-y-auto"
        style="width: 320px;" data-onboarding-spotlight="frame" data-onboarding-target="sequence-sidebar">
        <div class="h-16 flex items-center px-6 border-b border-border-subtle bg-surface-1 sticky top-0 z-10">
            <h3 class="text-text-main font-bold text-base tracking-tight flex items-center gap-2">
                <span class="material-symbols-outlined text-text-disabled">tune</span>
                <span data-i18n="seq_editor.settings_title">Настройки задания</span>
            </h3>
        </div>
        <div class="p-6 space-y-8">
            <div data-onboarding-target="sequence-logic-info">
                <label
                    class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-2 flex items-center gap-1">
                    <span data-i18n="seq_editor.logic_label">Логика проверки</span>
                    <span class="material-symbols-outlined text-[14px] text-icon-secondary cursor-help"
                        data-i18n-title="seq_editor.logic_info_title" title="Как проверяются ответы пользователя">info</span>
                </label>
                <div class="bg-surface-2 rounded-lg p-3 border border-border-subtle">
                    <p class="text-[11px] text-text-secondary leading-normal" data-i18n="seq_editor.logic_desc">
                        Пользователи должны распределить элементы по уровням и упорядочить их.
                    </p>
                </div>
            </div>
            <div class="space-y-4" data-onboarding-target="sequence-settings-block">
                <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-2" data-i18n="seq_editor.settings_label">Настройки
                    последовательности</label>
                <label class="inline-flex items-start gap-2 cursor-pointer">
                    <input id="order-inside-matters" checked=""
                        data-onboarding-target="sequence-order-inside"
                        class="mt-0.5 rounded border-border-subtle text-primary focus:ring-primary h-4 w-4"
                        type="checkbox" />
                    <span class="text-sm text-text-secondary leading-tight" data-i18n="seq_editor.order_inside_matters_label">Важна последовательность элементов внутри
                        уровней</span>
                </label>
                <label class="inline-flex items-start gap-2 cursor-pointer">
                    <input id="level-order-matters"
                        data-onboarding-target="sequence-level-order"
                        class="mt-0.5 rounded border-border-subtle text-primary focus:ring-primary h-4 w-4"
                        type="checkbox" />
                    <span class="text-sm text-text-secondary leading-tight" data-i18n="seq_editor.level_order_matters_label">Важна последовательность уровней</span>
                </label>
                <div class="bg-surface-2 rounded-lg p-3 border border-border-subtle mt-2">
                    <p id="settings-help-text" class="text-[11px] text-text-muted leading-normal"
                        data-onboarding-target="sequence-settings-help">
                        <!-- Dynamic content will be loaded here -->
                    </p>
                </div>
            </div>
        </div>
    </aside>

    <script src="../../assets/ConnectionMonitor.js"></script>
    <script src="/assets/onboarding_tours.js?v=sequence-onboarding-10" defer></script>
    <script src="/assets/OnboardingTour.js?v=sequence-onboarding-10" defer></script>
</body>

</html>
