<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="myelin-glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="trunk-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <style>
      @keyframes lvl8-signal {
        from { stroke-dashoffset: 30; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes lvl8-flash {
        0%, 100% { opacity: 0.65; transform: scale(0.95); }
        50% { opacity: 1.0; transform: scale(1.05); }
      }
      .lvl8-impulse {
        stroke-dasharray: 8 12;
        animation: lvl8-signal 1.5s infinite linear;
      }
      .lvl8-node {
        transform-origin: center;
        transform-box: fill-box;
        animation: lvl8-flash 1.8s infinite ease-in-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .lvl8-impulse, .lvl8-node { animation: none; }
        .lvl8-node { opacity: 0.85; }
      }
    </style>
  </defs>
  <rect width="64" height="64" fill="none" />
  
  <!-- Фоновые связи для объема -->
  <g stroke="#00F0FF" stroke-width="1.1" opacity="0.55">
    <line x1="14" y1="20" x2="50" y2="20" />
    <line x1="50" y1="20" x2="50" y2="44" />
    <line x1="50" y1="44" x2="14" y2="44" />
    <line x1="14" y1="44" x2="14" y2="20" />
    <line x1="32" y1="10" x2="14" y2="20" />
    <line x1="32" y1="10" x2="50" y2="20" />
    <line x1="32" y1="54" x2="14" y2="44" />
    <line x1="32" y1="54" x2="50" y2="44" />
  </g>
  
  <!-- Малые узлы -->
  <g fill="#00F0FF" opacity="0.5">
    <circle cx="14" cy="20" r="1.5" />
    <circle cx="50" cy="20" r="1.5" />
    <circle cx="14" cy="44" r="1.5" />
    <circle cx="50" cy="44" r="1.5" />
  </g>
  
  <!-- Диагональные и вертикальные миелиновые стволы -->
  <g>
    <!-- Основные пути -->
    <path d="M16,48 Q32,32 48,16" fill="none" stroke="#FF007A" stroke-width="7" stroke-linecap="round" opacity="0.25" filter="url(#myelin-glow-heavy)" />
    <path d="M16,48 Q32,32 48,16" fill="none" stroke="url(#trunk-grad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Бегущий импульс -->
    <path d="M16,48 Q32,32 48,16" class="lvl8-impulse" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
    
    <path d="M32,10 L32,54" fill="none" stroke="#7000FF" stroke-width="7" stroke-linecap="round" opacity="0.25" filter="url(#myelin-glow-heavy)" />
    <path d="M32,10 L32,54" fill="none" stroke="url(#trunk-grad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Бегущий импульс -->
    <path d="M32,10 L32,54" class="lvl8-impulse" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  </g>
  
  <!-- Полюсные узлы -->
  <circle cx="32" cy="10" r="4.5" class="lvl8-node" fill="#00F0FF" opacity="0.3" filter="url(#myelin-glow-heavy)" />
  <circle cx="32" cy="10" r="2.5" fill="#00F0FF" />
  <circle cx="32" cy="10" r="1" fill="#FFFFFF" />
  <circle cx="32" cy="54" r="4.5" class="lvl8-node" fill="#FF007A" opacity="0.3" filter="url(#myelin-glow-heavy)" />
  <circle cx="32" cy="54" r="2.5" fill="#FF007A" />
  <circle cx="32" cy="54" r="1" fill="#FFFFFF" />
  
  <!-- Мощный центральный узел пересечения -->
  <circle cx="32" cy="32" r="8" fill="#7000FF" opacity="0.35" filter="url(#myelin-glow-heavy)" />
  <circle cx="32" cy="32" r="5" fill="url(#trunk-grad)" />
  <circle cx="32" cy="32" r="2" fill="#FFFFFF" filter="url(#myelin-glow-heavy)" />
</svg>
