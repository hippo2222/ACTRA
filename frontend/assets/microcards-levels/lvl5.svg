<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="strong-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <style>
      @keyframes lvl5-core-pulse {
        0%, 100% { transform: scale(0.97); opacity: 0.8; }
        50% { transform: scale(1.03); opacity: 1.0; }
      }
      .lvl5-core {
        transform-origin: center;
        transform-box: fill-box;
        animation: lvl5-core-pulse 4s infinite ease-in-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .lvl5-core { animation: none; opacity: 0.9; }
      }
    </style>
  </defs>
  <rect width="64" height="64" fill="none" />
  
  <!-- Радиальные связи -->
  <g stroke="#00F0FF" stroke-width="1.5" opacity="0.6">
    <line x1="32" y1="32" x2="32" y2="12" />
    <line x1="32" y1="32" x2="50" y2="22" />
    <line x1="32" y1="32" x2="50" y2="42" />
    <line x1="32" y1="32" x2="32" y2="52" />
    <line x1="32" y1="32" x2="14" y2="42" />
    <line x1="32" y1="32" x2="14" y2="22" />
  </g>
  
  <!-- Наружный контур сети -->
  <polygon points="32,12 50,22 50,42 32,52 14,42 14,22" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.75" />
  
  <!-- Периферийные узлы -->
  <circle cx="32" cy="12" r="2.6" fill="#00F0FF" />
  <circle cx="50" cy="22" r="2.6" fill="#00F0FF" />
  <circle cx="50" cy="42" r="2.6" fill="#00F0FF" />
  <circle cx="32" cy="52" r="2.6" fill="#00F0FF" />
  <circle cx="14" cy="42" r="2.6" fill="#00F0FF" />
  <circle cx="14" cy="22" r="2.6" fill="#00F0FF" />
  
  <!-- Центральное ядро -->
  <g class="lvl5-core">
    <circle cx="32" cy="32" r="5.5" fill="url(#core-grad)" filter="url(#strong-glow)" />
    <circle cx="32" cy="32" r="2" fill="#FFFFFF" />
  </g>
</svg>
