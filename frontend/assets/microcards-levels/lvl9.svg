<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crystal-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="crystal-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5C00" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>
    <filter id="crystal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" fill="none" />

  <!-- Кристаллические полупрозрачные грани -->
  <g fill-opacity="0.25" stroke="#FF007A" stroke-width="1" stroke-linejoin="round">
    <polygon points="32,8 14,28 32,34" fill="url(#crystal-grad-1)" />
    <polygon points="32,8 50,28 32,34" fill="url(#crystal-grad-2)" />
    <polygon points="14,28 32,54 32,34" fill="url(#crystal-grad-2)" />
    <polygon points="50,28 32,54 32,34" fill="url(#crystal-grad-1)" />
  </g>

  <!-- Острые ребра жесткости -->
  <line x1="32" y1="8" x2="32" y2="54" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <line x1="14" y1="28" x2="50" y2="28" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

  <!-- Вершины кристалла -->
  <circle cx="32" cy="8" r="3" fill="#FF5C00" filter="url(#crystal-glow)" />
  <circle cx="14" cy="28" r="3" fill="#FF007A" filter="url(#crystal-glow)" />
  <circle cx="50" cy="28" r="3" fill="#9D4EDD" filter="url(#crystal-glow)" />
  <circle cx="32" cy="54" r="3" fill="#7000FF" filter="url(#crystal-glow)" />
  <circle cx="32" cy="34" r="4.5" fill="#FFFFFF" filter="url(#crystal-glow)" />
</svg>