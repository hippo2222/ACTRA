[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actra"
version = "1.0.0"
description = "ACTRA — система для создания и прохождения интерактивных заданий и тренировки насмотренности"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "ACTRA Team"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "flask>=3.0",
    "pywebview>=5.0",
    "Pillow==10.0.0",
    "packaging>=21.0",
    "pydantic>=2.0",
    "python-Levenshtein>=0.21.0",
    "pymorphy2>=0.9.0",
    "bcrypt>=4.0.0",
    "PyMuPDF>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-playwright>=0.4.0",
    "requests>=2.31.0",
    "mypy>=1.6.0",
    "black==26.1.0",
    "flake8>=6.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "task_system*"]
exclude = ["tests*", "desktop-app*", "frontend*", "data*", "reports*", "docs*", "scripts*"]


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
  "tests",
  "desktop-app/tests"
]
python_files = "test_*.py"
addopts = "-ra -q --strict-markers --disable-warnings --maxfail=1 --cov=task_system --cov=desktop-app --cov=common --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=10"
markers = [
  "integration: integration tests",
  "unit: unit tests"
]
filterwarnings = [
  "ignore::DeprecationWarning"
]
norecursedirs = [
  "task_system/*",
  "editor-app/*",
  "desktop-app/ui/*"
]

[tool.coverage.run]
omit = [
  "task_system/ui/**",
  "desktop-app/ui/**",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
files = [
  "desktop-app/api/complexes_api.py",
  "scripts/build_release.py",
  "scripts/validate_release_catalog.py",
  "scripts/check_mojibake.py",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
exclude = [
  "^(?:\\.?[\\\\/])?\\.venv[\\\\/].*",
  "^(?:\\.?[\\\\/])?node_modules[\\\\/].*",
  "^(?:\\.?[\\\\/])?build[\\\\/].*",
  "^(?:\\.?[\\\\/])?dist[\\\\/].*",
  "^(?:\\.?[\\\\/])?desktop-app[\\\\/](?!api[\\\\/]complexes_api\\.py$).+\\.pyi?$",
  "^(?:\\.?[\\\\/])?scripts[\\\\/](?!(build_release|validate_release_catalog|check_mojibake)\\.py$).+\\.pyi?$",
  "^(?:\\.?[\\\\/])?tests[\\\\/].+\\.pyi?$",
  "^(?:\\.?[\\\\/])?task_system[\\\\/].+\\.pyi?$",
  "^(?:\\.?[\\\\/])?common[\\\\/].+\\.pyi?$",
  "^(?:\\.?[\\\\/])?frontend[\\\\/].+\\.pyi?$",
  "^(?:\\.?[\\\\/])?data[\\\\/].+\\.pyi?$",
  "^(?:\\.?[\\\\/])?docs[\\\\/].+\\.pyi?$",
  "^(?:\\.?[\\\\/])?reports[\\\\/].+\\.pyi?$",
]

[[tool.mypy.overrides]]
module = "task_system.*"
strict = true

[tool.black]
required-version = "26.1.0"
line-length = 100
target-version = ["py310"]
include = "(desktop-app/api/complexes_api\\.py|scripts/build_release\\.py|scripts/validate_release_catalog\\.py|scripts/check_mojibake\\.py)$"

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  "desktop-app/ui",
  "editor-app",
]
