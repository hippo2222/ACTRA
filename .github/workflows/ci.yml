name: CI

on:
  push:
    branches: [ online-hosting, main, master ]
  pull_request:
    branches: [ online-hosting, main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install requests

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps

      - name: Python syntax check
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          skipped = {"node_modules", ".venv", "dist", "build", ".git", "__pycache__"}
          root = pathlib.Path(".").resolve()
          errors = []
          for path in root.rglob("*.py"):
              if any(part in skipped for part in path.parts):
                  continue
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  errors.append(f"{path}: {exc.msg}")

          if errors:
              print("Python syntax check failed:")
              for item in errors:
                  print(item)
              sys.exit(1)
          print("Python syntax check passed.")
          PY

      - name: Mojibake guard (critical UI)
        run: |
          python scripts/check_mojibake.py

      - name: Release data gate (empty baseline)
        run: |
          python scripts/validate_release_catalog.py --data-dir data --expect-empty

      - name: Black (runtime baseline)
        run: |
          python -m black --check .

      - name: Mypy (baseline configured files)
        run: |
          mypy .

      - name: Flake8 (critical baseline)
        run: |
          flake8 .

      - name: Start backend server
        run: |
          python desktop-app/server.py > server.log 2>&1 &
          echo $! > server.pid
          echo "Started server with PID: $(cat server.pid)"
          # Wait for server and API to be ready with timeout
          timeout 30 bash -c 'until curl -f -s http://127.0.0.1:8000/api/health > /dev/null 2>&1; do sleep 1; echo "Waiting for server..."; done' || {
            echo "Server failed to start. Log output:"
            cat server.log
            exit 1
          }
          echo "Server is ready"

      - name: Run tests with coverage
        run: |
          pytest

      - name: Stop backend server
        if: always()
        run: |
          if [ -f server.pid ]; then
            SERVER_PID=$(cat server.pid)
            echo "Stopping server (PID: $SERVER_PID)"
            kill $SERVER_PID 2>/dev/null || true
            # Wait for graceful shutdown
            for i in {1..10}; do
              if ! kill -0 $SERVER_PID 2>/dev/null; then
                echo "Server stopped gracefully"
                break
              fi
              sleep 1
            done
            # Force kill if still running
            kill -9 $SERVER_PID 2>/dev/null || true
            rm -f server.pid
          fi

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.python-version }}
          path: server.log
          if-no-files-found: ignore

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci

      - name: Frontend lint
        run: |
          npm run lint:frontend

      - name: Run unit tests
        run: |
          npm test

      - name: Validate themes
        run: |
          npm run validate:themes

      - name: Build CSS
        run: |
          npm run build:css





































