name: Release Manifest

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-latest-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate latest.json from GitHub Release
        uses: actions/github-script@v7
        env:
          DEFAULT_ASSET_NAME: ACTRA-Setup.exe
          ASSET_NAME: ${{ vars.ACTRA_UPDATE_ASSET_NAME }}
          MIN_SUPPORTED_VERSION: ${{ vars.ACTRA_MIN_SUPPORTED_VERSION }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let release = context.payload.release;
            if (!release) {
              const { data } = await github.rest.repos.getLatestRelease({ owner, repo });
              release = data;
            }

            const requestedAssetName = (process.env.ASSET_NAME || '').trim();
            const defaultAssetName = (process.env.DEFAULT_ASSET_NAME || 'ACTRA-Setup.exe').trim();
            const preferredAssetName = requestedAssetName || defaultAssetName;

            const assets = Array.isArray(release.assets) ? release.assets : [];
            let asset = assets.find((a) => a.name === preferredAssetName);
            if (!asset) {
              asset = assets.find((a) => /\.exe$/i.test(a.name || ''));
            }
            if (!asset && assets.length > 0) {
              asset = assets[0];
            }

            const tag = String(release.tag_name || '').trim();
            const normalizedVersion = tag.replace(/^v/i, '') || '0.0.0';
            const minSupported = (process.env.MIN_SUPPORTED_VERSION || '').trim() || normalizedVersion;

            const manifest = {
              latest_version: normalizedVersion,
              min_supported_version: minSupported,
              download_url: asset ? String(asset.browser_download_url || '') : String(release.html_url || ''),
              notes_url: String(release.html_url || ''),
              published_at: String(release.published_at || new Date().toISOString()),
            };

            if (!manifest.download_url) {
              core.setFailed('Unable to resolve download_url from release assets or release html_url.');
              return;
            }

            const outDir = path.join(process.cwd(), 'manifest-out');
            fs.mkdirSync(outDir, { recursive: true });
            fs.writeFileSync(
              path.join(outDir, 'latest.json'),
              JSON.stringify(manifest, null, 2) + '\n',
              'utf8'
            );
            fs.writeFileSync(path.join(outDir, '.nojekyll'), '', 'utf8');

            core.info(`Prepared latest.json for tag=${tag} asset=${asset ? asset.name : 'none'}`);

      - name: Publish latest.json to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: manifest-out
          keep_files: true

